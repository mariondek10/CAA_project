services:
  flask-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/key.json
    volumes:
      # Monte ton fichier de clé GCP dans le container (jamais copié dans l'image !)
      - ./secrets/key.json:/app/secrets/key.json:ro
    restart: unless-stopped
